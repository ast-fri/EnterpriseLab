services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --max-allowed-packet=128M
      - --innodb-log-file-size=64M
    environment:
      MYSQL_ROOT_PASSWORD: owncloud-root-local
      MYSQL_DATABASE: owncloud
      MYSQL_USER: owncloud
      MYSQL_PASSWORD: owncloud-local
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - owncloud_db_data:/var/lib/mysql

  owncloud:
    image: owncloud/server:10.16.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OWNCLOUD_HOST_PORT:-8083}:8080"
    environment:
      OWNCLOUD_DOMAIN: localhost:${OWNCLOUD_HOST_PORT:-8083}
      OWNCLOUD_TRUSTED_DOMAINS: localhost,127.0.0.1
      OWNCLOUD_ADMIN_USERNAME: admin
      OWNCLOUD_ADMIN_PASSWORD: Admin123!
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_NAME: owncloud
      OWNCLOUD_DB_USERNAME: owncloud
      OWNCLOUD_DB_PASSWORD: owncloud-local
      OWNCLOUD_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/status.php >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    volumes:
      - owncloud_files:/mnt/data

volumes:
  owncloud_files:
  owncloud_db_data:
